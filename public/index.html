<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copiloto Ui24R</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mix-page">
  <header class="topbar">
    <strong class="logo">Copiloto</strong>
    <nav class="nav"><a href="/" class="active" aria-current="page">Mixagem</a><a href="conexao.html">Conexão</a></nav>

    <label class="field" title="Qual saída da mesa aparece e é controlada">
      <span>Saída</span>
      <select id="bus-select"></select>
    </label>

    <div class="seg modes" role="radiogroup" aria-label="Modo">
      <button data-mode="desligado" title="Só mostra os níveis">Desligado</button>
      <button data-mode="observar" title="Calcula as correções mas NÃO mexe na mesa">Observar</button>
      <button data-mode="automatico" title="Ajusta os envios e efeitos devagar, dentro dos limites">Automático</button>
    </div>

    <button id="capture" class="primary small-btn" title="Use quando a mixagem estiver soando bem: o nível atual de cada canal vira o alvo">Gravar alvo</button>
    <button id="restore" class="danger small-btn" title="Volta os envios para a mixagem original (ou do preset carregado)">Voltar ao original</button>

    <div class="field presets">
      <span>Preset</span>
      <select id="preset-select" title="Carregar preset (com fade suave)"></select>
      <button id="preset-new" class="icon-btn" title="Salvar a mixagem atual como novo preset">+</button>
      <button id="preset-update" class="icon-btn" title="Atualizar o preset ativo com a mixagem atual">↻</button>
      <button id="preset-delete" class="icon-btn" title="Apagar o preset ativo">×</button>
    </div>

    <details class="menu">
      <summary>Exibir</summary>
      <div class="menu-body">
        <label><input type="checkbox" id="show-fx" checked> envios de efeito por canal</label>
        <label><input type="checkbox" id="show-all"> line, player e canais sem envio</label>
        <label><input type="checkbox" id="show-target" checked> ajuste de alvo (− / +)</label>
        <div class="seg views">
          <button data-view="mesa">Mesa</button>
          <button data-view="tabela">Tabela</button>
        </div>
      </div>
    </details>

    <a id="conn" class="pill" href="conexao.html" title="Abrir a tela de conexão">…</a>
  </header>

  <section id="sim" class="simbar" hidden>
    <strong>SIMULADOR</strong>
    <span>mesa falsa para testes — nada é enviado para a Ui24R.</span>
    <span class="sep">Momento:</span>
    <button data-scene="louvor">Louvor</button>
    <button data-scene="pregacao">Pregação</button>
    <button data-scene="avisos">Avisos</button>
    <button id="sim-reset">Zerar músicos</button>
    <a href="conexao.html" class="simbar-link">Usar a mesa real →</a>
  </section>

  <main id="mixer" class="mixer"></main>
  <p id="no-bus" class="empty-state" hidden>Escolha uma <strong>Saída</strong> lá em cima (ex.: AUX 7+8 da live).</p>

  <footer class="statusline">
    <span id="mode-help" class="muted"></span>
    <details class="history">
      <summary id="last-event">—</summary>
      <ul id="events"></ul>
    </details>
  </footer>

  <template id="bus-tpl">
    <section class="bus">
      <div class="bus-head">
        <strong class="bus-title"></strong>
        <span class="bus-help"></span>
        <span class="legend"><i class="lg lg-fill"></i>agora <i class="lg lg-avg"></i>média <i class="lg lg-target"></i>alvo</span>
      </div>
      <div class="strips mixer-view">
        <div class="group ch-group"></div>
        <div class="group fx-group"></div>
        <div class="group master-group"></div>
      </div>
      <div class="table-view">
        <table>
          <thead>
            <tr>
              <th>Auto</th>
              <th>Canal</th>
              <th>Estado</th>
              <th class="meter-col">Peso na saída (nível + envio) · alvo</th>
              <th>Envio</th>
              <th>Correção</th>
              <th>Alvo</th>
              <th class="sim-col">Simular</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
